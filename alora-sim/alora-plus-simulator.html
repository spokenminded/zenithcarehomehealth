<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; frame-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>AloraPlus Training Simulator (practice copy)</title>
<style>
/* AloraPlus Training Simulator. A practice copy: nothing here is real and nothing is sent anywhere. */
:root {
  --navy: #1d3a7a; --blue: #2b7bb9; --blue2: #428bba; --lblue: #5bafe3; --lblue-d: #4a9bd0; --green: #7fb13a; --green-d: #6a9a2d;
  --red: #d9534f; --orange: #f5a742; --pink: #e0457b; --purple: #8e7cc3; --dark: #444; --gray: #f4f4f4; --line: #dcdcdc; --ink: #333; --muted: #777;
  --sim: #1b2b4b; --gold: #d4af62;
  --font: "Segoe UI", "Open Sans", Arial, "Liberation Sans", Helvetica, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.4 var(--font); color: var(--ink); background: #fff; }
a { color: var(--blue); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
[hidden] { display: none !important; }

/* ---------------------------------------------------------------- simulator bar (not part of Alora) */
#simbar { position: sticky; top: 0; z-index: 900; background: var(--sim); color: #fff; display: flex; align-items: center; gap: 10px; padding: 5px 12px; font-size: 12px; flex-wrap: wrap; border-bottom: 3px solid var(--gold); }
#simbar b.tag { background: var(--gold); color: var(--sim); padding: 2px 8px; border-radius: 3px; letter-spacing: .06em; font-size: 11px; }
#simbar .msg { opacity: .85; }
#simbar .grow { flex: 1; }
#simbar select, #simbar button { font-size: 12px; padding: 3px 8px; border-radius: 4px; border: 1px solid #6f7fa6; background: #2a3d66; color: #fff; }
#simbar button:hover { background: #3a5086; }
#simbar .clock { font-variant-numeric: tabular-nums; background: #0f1a30; padding: 3px 8px; border-radius: 4px; border: 1px solid #44567f; }
#simbar .ref { color: var(--gold); }
#simbar .sep { width: 1px; height: 18px; background: #44567f; }

/* ---------------------------------------------------------------- login */
#login { min-height: calc(100vh - 36px); display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #eaf2fb, #f8fbff); padding: 20px; }
.login-card { width: 400px; max-width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, .1); padding: 26px 28px; }
.login-card .logo { margin-bottom: 14px; }
.login-card label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13px; }
.login-card input { width: 100%; padding: 9px 10px; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
.login-card .btn { width: 100%; margin-top: 16px; padding: 10px; }
.login-card .demo { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 12px; color: #555; }
.login-card .demo button { margin: 2px 3px 2px 0; padding: 3px 8px; font-size: 12px; border: 1px solid #aac; background: #f2f6fc; border-radius: 3px; }
.login-card .err { color: var(--red); margin-top: 10px; font-size: 13px; }
.sim-note { background: #fff6dc; border: 1px solid #e0b040; color: #6a4500; border-radius: 4px; padding: 7px 10px; font-size: 12px; margin-top: 12px; }

/* ---------------------------------------------------------------- logo (a plain text wordmark; not the real logo) */
.wordmark { font: 800 26px/1 var(--font); color: var(--navy); letter-spacing: -.5px; }
.wordmark i { font-style: normal; font-weight: 700; font-size: 17px; color: var(--blue); margin-left: 2px; }
.wordmark small { display: block; font: 600 8px var(--font); letter-spacing: .16em; color: var(--muted); margin-top: 2px; }

/* ---------------------------------------------------------------- shell */
#shell { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 62px 1fr; min-height: calc(100vh - 36px); }
#shell.collapsed { grid-template-columns: 60px 1fr; }
#hdr { grid-column: 1 / 3; display: flex; align-items: center; gap: 18px; padding: 0 18px; border-bottom: 1px solid var(--line); background: #fff; }
#hdr .wordmark { width: 214px; }
#shell.collapsed #hdr .wordmark { width: 214px; }
#gsearch { position: relative; width: 420px; max-width: 40vw; }
#gsearch .box { display: flex; align-items: center; background: #f1f4f8; border-radius: 22px; padding: 4px 6px 4px 14px; gap: 8px; border: 1px solid transparent; }
#gsearch .box:focus-within { border-color: var(--lblue); background: #fff; }
#gsearch input { border: 0; background: transparent; flex: 1; font: inherit; outline: 0; min-width: 0; }
#gsearch .new { background: #dcebfb; color: #1f6fd0; font-weight: 700; font-size: 12px; border: 0; border-radius: 14px; padding: 4px 12px; }
#gsearch .res { position: absolute; top: 40px; left: 0; right: 0; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0, 0, 0, .15); border-radius: 4px; z-index: 600; max-height: 360px; overflow: auto; }
#gsearch .res a { display: block; padding: 7px 12px; border-bottom: 1px solid #f0f0f0; color: var(--ink); }
#gsearch .res a:hover { background: #eef5fc; text-decoration: none; }
#gsearch .res small { color: var(--muted); margin-left: 6px; }
#hdr .grow { flex: 1; }
#usermenu { position: relative; }
#usermenu button { background: #3e3e3e; color: #fff; border: 0; padding: 9px 18px; border-radius: 2px; font-weight: 600; min-width: 150px; }
#usermenu .dd { position: absolute; right: 0; top: 40px; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0, 0, 0, .15); min-width: 200px; z-index: 600; }
#usermenu .dd a { display: block; padding: 8px 12px; color: var(--ink); border-bottom: 1px solid #f0f0f0; }
#usermenu .dd a:hover { background: #eef5fc; text-decoration: none; }

#nav { background: #f7f7f7; border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; max-height: calc(100vh - 98px); position: sticky; top: 36px; align-self: start; height: calc(100vh - 98px); }
#nav .it { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #555; border-bottom: 1px solid #ececec; cursor: pointer; position: relative; user-select: none; }
#nav .it:hover { background: #fff; }
#nav .it svg { width: 20px; height: 20px; flex: none; fill: #666; }
#nav .it .lbl { flex: 1; }
#nav .it .car { width: 12px; height: 12px; fill: none; stroke: #777; stroke-width: 2; transition: transform .15s; }
#nav .grp.open > .it .car { transform: rotate(180deg); }
#nav .it.on { background: #fff; color: var(--blue); font-weight: 600; }
#nav .it.on svg { fill: var(--blue); }
#nav .it.on::after { content: ""; position: absolute; right: 0; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right-color: var(--blue); }
#nav .badge { background: #f5a742; color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
#nav .sub { display: none; background: #fcfcfc; }
#nav .grp.open > .sub { display: block; }
#nav .sub a { display: block; padding: 10px 16px 10px 48px; color: #666; border-bottom: 1px solid #f1f1f1; font-size: 13px; position: relative; line-height: 1.3; }
#nav .sub a:hover { background: #fff; text-decoration: none; }
#nav .sub a.on { color: var(--blue); font-weight: 600; background: #f3f8fd; }
#nav .sub a.on::after { content: ""; position: absolute; right: 0; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right-color: var(--blue); }
#shell.collapsed #nav .lbl, #shell.collapsed #nav .car, #shell.collapsed #nav .badge, #shell.collapsed #nav .sub { display: none !important; }
#shell.collapsed #nav .it { justify-content: center; padding: 12px 0; }

#main { min-width: 0; padding: 0 22px 16px 22px; display: flex; flex-direction: column; background: #fff; }
#content { flex: 1; padding-top: 14px; }
#foot { border-top: 1px solid #eee; margin-top: 30px; padding: 12px 0; color: #666; font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- page parts */
.ptitle { font: 300 34px/1.1 var(--font); color: var(--blue); padding: 10px 0 10px; border-bottom: 1px solid #eee; margin-bottom: 14px; }
.ptitle small { font: 600 15px var(--font); color: #5b6772; margin-left: 8px; }
.ptitle small::before { content: "\00bb\00a0"; }
.bar { background: #f3f3f3; border: 1px solid #ececec; padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; position: relative; }
.bar h2 { font: 300 26px var(--font); color: #555; display: flex; align-items: center; gap: 10px; margin-right: 6px; }
.bar h2 svg { width: 26px; height: 26px; fill: #777; }
.sec { background: var(--blue2); color: #fff; font: 600 24px/1 var(--font); padding: 16px 16px; margin: 18px 0 14px; letter-spacing: -.3px; }
.sec.sm { font-size: 18px; padding: 10px 14px; }
.box { border: 1px solid #bcd2e5; border-radius: 3px; padding: 12px 16px 14px; margin: 12px 0; background: #fff; }
.box > h4 { font: 400 20px var(--font); color: #555; margin: 0 0 8px; }
.note { padding: 10px 14px; border-radius: 3px; border: 1px solid #bce8f1; background: #d9edf7; color: #31708f; margin: 10px 0; display: flex; gap: 10px; align-items: flex-start; }
.note .x { margin-left: auto; cursor: pointer; opacity: .5; font-weight: 700; }
.note.warn { background: #fcf8e3; border-color: #faebcc; color: #8a6d3b; }
.note.err { background: #f2dede; border-color: #ebccd1; color: #a94442; }
.note.ok { background: #dff0d8; border-color: #d6e9c6; color: #3c763d; }
.note.sim { background: #fff6dc; border-color: #e0b040; color: #6a4500; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; background: #e9eef5; color: #35506b; }
.chip.simp { background: #fff2cc; color: #7a5200; border: 1px dashed #d79a00; }
.small { font-size: 12px; color: var(--muted); }
.flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.right { margin-left: auto; }
.mt { margin-top: 12px; }
.hr { border: 0; border-top: 1px solid #eee; margin: 14px 0; }
.tc { text-align: center; }

/* ---------------------------------------------------------------- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border: 1px solid transparent; border-radius: 3px; color: #fff; background: var(--lblue); font-weight: 400; line-height: 1.2; white-space: nowrap; }
.btn:hover { filter: brightness(.94); text-decoration: none; }
.btn[disabled], .btn.dis { opacity: .5; cursor: not-allowed; filter: grayscale(.4); }
.btn-add { background: var(--lblue); }
.btn-save { background: var(--green); }
.btn-cancel { background: #3b82c4; }
.btn-del { background: var(--red); }
.btn-close { background: var(--dark); }
.btn-back { background: var(--purple); }
.btn-or { background: var(--orange); }
.btn-pink { background: var(--pink); }
.btn-gray { background: #adb5bd; }
.btn-ok { background: #66b36a; }
.btn-light { background: #fff; color: #444; border-color: #ccc; }
.btn-blue { background: #337ab7; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn.filt { background: var(--lblue-d); width: 38px; padding: 7px 0; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.ico { width: 18px; height: 18px; vertical-align: middle; fill: currentColor; }
.ico-btn { background: none; border: 0; padding: 2px 3px; cursor: pointer; }
.ico-btn svg { width: 19px; height: 19px; }
.ico-edit { color: #2b88c9; } .ico-del { color: #d9534f; } .ico-print { color: #2b6ca3; } .ico-word { color: #2b579a; } .ico-pdf { color: #d9534f; } .ico-view { color: #337ab7; } .ico-clip { color: #5a8fc4; } .ico-green { color: #5cb85c; }

/* ---------------------------------------------------------------- forms */
.fg { margin: 10px 0; }
.fg > label, .lab { display: block; margin-bottom: 4px; font-size: 14px; color: #444; }
.fg > label.req::after { content: " *"; color: var(--red); }
input[type=text], input[type=password], input[type=email], input[type=tel], input[type=number], input[type=search], textarea, select, .s2, input[type=file] { width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 2px; font: inherit; background: #fff; color: #444; }
input:focus, textarea:focus, select:focus, .s2.open { outline: 0; border-color: #66afe9; box-shadow: 0 0 0 2px rgba(102, 175, 233, .25); }
input[readonly], input:disabled, select:disabled, textarea:disabled { background: #eee; color: #777; }
input.bad, select.bad, textarea.bad, .s2.bad { border-color: var(--red) !important; box-shadow: 0 0 0 2px rgba(217, 83, 79, .2); }
textarea { resize: vertical; min-height: 70px; }
.row { display: grid; gap: 14px; }
.row.c2 { grid-template-columns: 1fr 1fr; } .row.c3 { grid-template-columns: 1fr 1fr 1fr; } .row.c4 { grid-template-columns: repeat(4, 1fr); } .row.c5 { grid-template-columns: repeat(5, 1fr); }
.row.auto { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.chk { display: inline-flex; align-items: center; gap: 7px; margin: 2px 14px 2px 0; cursor: pointer; }
.chk input { width: 16px; height: 16px; margin: 0; }
.chkbox { display: inline-flex; gap: 14px; flex-wrap: wrap; border: 1px solid #aac6e0; padding: 8px 12px; border-radius: 3px; background: #fff; }
.errtxt { color: var(--red); font-size: 12px; margin-top: 2px; }
.s2 { position: relative; padding-right: 26px; min-height: 34px; cursor: pointer; color: #333; display: flex; align-items: center; }
.s2 .ph { color: #999; }
.s2::after { content: ""; position: absolute; right: 9px; top: 15px; border: 4px solid transparent; border-top-color: #777; }
.s2 .clr { position: absolute; right: 22px; top: 6px; color: #888; font-weight: 700; padding: 0 4px; }
.s2.dis { background: #eee; cursor: not-allowed; }
.s2pop { position: absolute; z-index: 1300; background: #fff; border: 1px solid #66afe9; box-shadow: 0 8px 22px rgba(0, 0, 0, .2); min-width: 260px; max-height: 340px; display: flex; flex-direction: column; }
.s2pop .q { display: flex; align-items: center; border-bottom: 1px solid #ddd; padding: 4px 8px; }
.s2pop .q input { border: 0; box-shadow: none; padding: 5px 0; }
.s2pop .lst { overflow: auto; flex: 1; }
.s2pop .opt { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid #f3f3f3; }
.s2pop .opt:hover, .s2pop .opt.hl { background: #337ab7; color: #fff; }
.s2pop .opt.sel { background: #e8f1fa; }
.s2pop table { width: 100%; border-collapse: collapse; font-size: 13px; }
.s2pop th { text-align: left; padding: 5px 8px; background: #eee; font-weight: 700; font-size: 12px; border-bottom: 1px solid #ccc; }
.s2pop td { padding: 6px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
.s2pop tr.opt:hover td, .s2pop tr.hl td { background: #337ab7; color: #fff; }
.s2pop .grp { padding: 4px 10px; font-weight: 700; text-align: center; background: #f1f1f1; }
.s2pop .none { padding: 12px; color: #888; text-align: center; }
.dpop { position: absolute; z-index: 1400; background: #fff; border: 1px solid #aaa; box-shadow: 0 8px 22px rgba(0, 0, 0, .25); padding: 8px; width: 266px; font-size: 13px; }
.dpop .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 700; }
.dpop .hd button { border: 1px solid #ccc; background: #f7f7f7; border-radius: 3px; padding: 1px 8px; }
.dpop .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.dpop .g b { text-align: center; font-size: 11px; color: #777; }
.dpop .g button { border: 0; background: #fff; padding: 5px 0; border-radius: 3px; }
.dpop .g button:hover { background: #cfe5f7; }
.dpop .g button.o { color: #aaa; } .dpop .g button.t { background: #fff3c4; } .dpop .g button.s { background: #337ab7; color: #fff; }
.dpop .tm { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.dpop .tm select { width: auto; padding: 3px; }
.dpop .ft { display: flex; justify-content: space-between; margin-top: 8px; }

/* ---------------------------------------------------------------- tables */
.dt { width: 100%; }
.dt-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
.dt-top .sr { display: flex; align-items: center; gap: 6px; }
.dt-top .sr input { width: 190px; }
.dt-top select { width: 66px; display: inline-block; padding: 3px 6px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; }
table.t th { text-align: left; padding: 10px 10px; background: linear-gradient(#f9f9f9, #ebebeb); border-bottom: 1px solid #ddd; color: #555; font-weight: 600; position: relative; white-space: nowrap; }
table.t th.srt { cursor: pointer; padding-right: 20px; }
table.t th.srt::after { content: "\2195"; position: absolute; right: 6px; opacity: .35; font-size: 12px; }
table.t th.asc::after { content: "\25B2"; opacity: .9; color: var(--blue); } table.t th.desc::after { content: "\25BC"; opacity: .9; color: var(--blue); }
table.t th.blue { color: var(--blue); }
table.t td { padding: 10px 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
table.t tbody tr:hover td { background: #f6faff; }
table.t tr.draft td { background: #ffff00 !important; }
table.t tr.er td { background: #fde8e6; }
table.t tr.hl td { background: #38577b; color: #fff; }
table.t tr.sel td { background: #dfeefb; }
table.t td.none { text-align: center; color: #555; background: #f8f8f8; }
.dt-bot { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; gap: 10px; flex-wrap: wrap; }
.pg { display: flex; gap: 4px; }
.pg button { border: 1px solid #ddd; background: #fff; padding: 6px 12px; color: #555; border-radius: 0; }
.pg button.on { background: var(--lblue); color: #fff; border-color: var(--lblue); }
.pg button[disabled] { color: #aaa; cursor: default; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; font-weight: 700; color: #fff; background: #888; }
.tag.g { background: #5cb85c; } .tag.y { background: #e5b300; color: #333; } .tag.r { background: #d9534f; } .tag.b { background: #337ab7; } .tag.o { background: #f0ad4e; } .tag.gr { background: #999; }

/* ---------------------------------------------------------------- tabs */
.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid #ddd; margin: 4px 0 0; }
.tabs a { padding: 10px 16px; color: #999; border: 1px solid transparent; border-bottom: 0; margin-bottom: -1px; border-radius: 3px 3px 0 0; background: #fafafa; }
.tabs a.on { color: #444; background: #fff; border-color: #ddd; font-weight: 600; border-top: 3px solid var(--blue); padding-top: 8px; }
.tabs a.off { color: #bbb; cursor: not-allowed; }
.tabs a:hover { text-decoration: none; background: #fff; }
.tabpane { border: 1px solid #ddd; border-top: 0; padding: 14px 16px 18px; }
.vo { color: var(--red); font-weight: 700; padding: 3px 6px; border: 1px dashed var(--red); display: inline-block; }

/* ---------------------------------------------------------------- modal / toast */
#modal-root .bd { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 1250; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 40px 14px; }
.modal { background: #fff; width: 640px; max-width: 100%; border-radius: 4px; box-shadow: 0 10px 40px rgba(0, 0, 0, .4); }
.modal.w-lg { width: 900px; } .modal.w-sm { width: 460px; } .modal.w-xl { width: 1100px; }
.modal .mh { background: #428bca; color: #fff; padding: 16px 18px; font-size: 20px; display: flex; align-items: center; justify-content: space-between; border-radius: 4px 4px 0 0; }
.modal .mh .x { background: none; border: 0; color: #fff; font-size: 22px; opacity: .8; }
.modal .mb { padding: 16px 18px; max-height: calc(100vh - 220px); overflow: auto; }
.modal .mf { padding: 12px 18px; background: #f5f7fa; border-top: 1px solid #e5e5e5; text-align: right; display: flex; gap: 8px; justify-content: flex-end; border-radius: 0 0 4px 4px; flex-wrap: wrap; }
.modal.warnm .mh { background: #e8a33a; } .modal.dangerm .mh { background: var(--red); } .modal.simm .mh { background: var(--sim); color: var(--gold); }
#toast-root { position: fixed; right: 16px; bottom: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #333; color: #fff; padding: 10px 14px; border-radius: 4px; box-shadow: 0 4px 14px rgba(0, 0, 0, .3); max-width: 380px; font-size: 13px; }
.toast.ok { background: #3c763d; } .toast.err { background: #a94442; } .toast.sim { background: var(--sim); border-left: 4px solid var(--gold); }

/* ---------------------------------------------------------------- calendar */
.cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
.cal th { background: #e8edf3; padding: 6px; font-weight: 600; color: #555; border: 1px solid #d8d8d8; }
.cal td { border: 1px solid #ddd; vertical-align: top; height: 112px; padding: 2px 4px; cursor: pointer; position: relative; }
.cal td:hover { background: #f5faff; }
.cal td.o { background: #fafafa; color: #bbb; }
.cal td.today { background: #fffbe0; }
.cal td .dn { text-align: right; color: #666; font-size: 13px; }
.ev { display: block; font-size: 12px; color: #fff; border-radius: 3px; padding: 1px 4px; margin: 2px 0; background: #3a87ad; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
.ev.g { background: #3fae49; } .ev.y { background: #e5a400; } .ev.r { background: #d9534f; } .ev.gray { background: #999; } .ev.p { background: #8e6cc0; } .ev.b { background: #3a87ad; }

/* ---------------------------------------------------------------- router */

}

}

/* ---------------------------------------------------------------- guard rails: Zenith rules and things the simulator never actually does */
// A rule that needs approval. Practice is allowed, but the coaching is recorded.
function needApproval(o) {

  modal({
    title: 'Zenith rule: approval needed', kind: 'warn', size: 'sm',
    body: `<p><b>${o.what}</b></p><p class="mt">${o.rule}</p><p class="mt small">Who approves: ${o.who || 'Administrator'} ${o.ref ? '(manual ' + o.ref + ')' : ''}</p><p class="mt">In real work you would STOP and ask. In this simulator you may continue so you can see what happens, and the choice is written in the Coach log.</p>`,
    buttons: [{ label: 'Stop (recommended)', cls: 'btn-ok', click: () => { simLog('good', 'Stopped and asked: ' + o.what); } }, { label: 'I have approval. Continue (practice)', cls: 'btn-or', click: () => { simLog('override', 'Continued without ' + (o.who || 'Administrator') + ' approval: ' + o.what); o.go(); } }],
  });
}
// An action the simulator will never perform (it would touch real money, a real fax, or real exports in the real Alora).
function neverDo(what, consequence, rule) {
  simLog('blocked', what + '. ' + consequence);
  modal({
    title: 'Simulator safety: nothing was done', kind: 'sim', size: 'sm',
    body: `<p><b>${what}</b></p><p class="mt">${consequence}</p>${rule ? `<p class="mt small">${rule}</p>` : ''}<p class="mt note sim">In the real Alora this is a real action. Here nothing was created, sent, billed or exported. The attempt is recorded in the Coach log.</p>`,
    buttons: [{ label: 'OK', cls: 'btn-ok' }],
  });
}

/* ---------------------------------------------------------------- date picker */
let DPOP = null;
function closeDP() { if (DPOP) { DPOP.remove(); DPOP = null; } }
document.addEventListener('focusin', e => { const t = e.target; if (t.dataset && t.dataset.dp && !t.readOnly && !t.disabled) openDP(t); else if (DPOP && !DPOP.contains(t)) closeDP(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && DPOP) { closeDP(); e.stopPropagation(); } }, true);
document.addEventListener('click', e => { const t = e.target; if (t.dataset && t.dataset.dp && !t.readOnly && !t.disabled && !DPOP) openDP(t); if (DPOP && !e.target.closest('.dpop') && !(t.dataset && t.dataset.dp)) closeDP(); });
function openDP(inp) {
  closeDP(); const withTime = inp.dataset.dp === 'dt';
  const cur = withTime ? parseDT(inp.value) : parseD(inp.value);
  let view = toDate(cur || todayIso()); view = new Date(view.getFullYear(), view.getMonth(), 1);
  let sel = cur ? toDate(cur) : null; let hh = sel ? sel.getHours() : 8, mm = sel ? sel.getMinutes() : 0;
  const pop = document.createElement('div'); pop.className = 'dpop'; DPOP = pop;
  const r = inp.getBoundingClientRect(); pop.style.left = (r.left + window.scrollX) + 'px'; pop.style.top = (r.bottom + window.scrollY + 2) + 'px';
  const commit = d => {
    let v = pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + '/' + d.getFullYear();
    if (withTime) { const h12 = hh % 12 || 12; v += ' ' + pad(h12) + ':' + pad(mm) + ' ' + (hh >= 12 ? 'PM' : 'AM'); }
    inp.value = v; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
  };
  const draw = () => {
    const y = view.getFullYear(), mo = view.getMonth(); const first = new Date(y, mo, 1).getDay(); const dim = new Date(y, mo + 1, 0).getDate(); const tdy = nowDate();
    let cells = DAYS.map(d => `<b>${d.slice(0, 2)}</b>`).join('');
    for (let i = 0; i < first; i++) { const d = new Date(y, mo, i - first + 1); cells += `<button class="o" data-d="${isoD(d)}">${d.getDate()}</button>`; }
    for (let d = 1; d <= dim; d++) { const dd = new Date(y, mo, d); const cls = (sel && isoD(sel) === isoD(dd)) ? 's' : (isoD(tdy) === isoD(dd) ? 't' : ''); cells += `<button class="${cls}" data-d="${isoD(dd)}">${d}</button>`; }
    const tail = (7 - ((first + dim) % 7)) % 7; for (let i = 1; i <= tail; i++) { const d = new Date(y, mo + 1, i); cells += `<button class="o" data-d="${isoD(d)}">${i}</button>`; }
    pop.innerHTML = `<div class="hd"><button data-n="-1">&lt;</button><span>${MONTHS[mo]} ${y}</span><button data-n="1">&gt;</button></div><div class="g">${cells}</div>` +
      (withTime ? `<div class="tm">Time <select data-h>${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}"${((hh % 12) || 12) === i + 1 ? ' selected' : ''}>${pad(i + 1)}</option>`).join('')}</select>:<select data-m>${Array.from({ length: 12 }, (_, i) => `<option value="${i * 5}"${mm === i * 5 ? ' selected' : ''}>${pad(i * 5)}</option>`).join('')}</select><select data-ap><option${hh < 12 ? ' selected' : ''}>AM</option><option${hh >= 12 ? ' selected' : ''}>PM</option></select></div>` : '') +
      `<div class="ft"><button data-today class="btn btn-sm btn-light">Today</button><button data-close class="btn btn-sm btn-light">Close</button></div>`;
  };
  draw(); document.body.appendChild(pop);
  const readTime = () => { const h = +$('[data-h]', pop).value, ap = $('[data-ap]', pop).value; hh = (h % 12) + (ap === 'PM' ? 12 : 0); mm = +$('[data-m]', pop).value; };
  pop.addEventListener('click', e => {
    const n = e.target.closest('[data-n]'); if (n) { view = new Date(view.getFullYear(), view.getMonth() + +n.dataset.n, 1); draw(); return; }
    const d = e.target.closest('[data-d]'); if (d) { if (withTime) readTime(); sel = toDate(d.dataset.d); commit(sel); if (!withTime) closeDP(); else draw(); return; }
    if (e.target.closest('[data-today]')) { if (withTime) readTime(); sel = toDate(todayIso()); commit(sel); closeDP(); return; }
    if (e.target.closest('[data-close]')) closeDP();
  });
  pop.addEventListener('change', () => { if (withTime) { readTime(); if (sel) commit(sel); } });
}

    else lst.innerHTML = (S.head ? `<div class="grp">${esc(S.head)}</div>` : '') + items.map((o, i) => `<div class="opt${String(o.v) === String(cur) ? ' sel' : ''}${i === S2POP.hl ? ' hl' : ''}" data-i="${i}">${esc(o.label)}</div>`).join('');
  };

function visitsOn(day) { return DB.visits.filter(v => v.start.slice(0, 10) === day); }
function visitStatus(v) {
  // returns {label, delayed (minutes), cls}
  const now = nowIso(); const e = v.evv || {};
  if (v.status === 'C') return { label: 'Completed', delayed: 0, cls: 'g' };
  if (v.status === 'A') return { label: 'Cancelled', delayed: 0, cls: 'gr' }; if (v.status === 'M') return { label: 'Missed', delayed: 0, cls: 'r' }; if (v.status === 'H') return { label: 'Hospitalized', delayed: 0, cls: 'o' }; if (v.status === 'O') return { label: 'On Hold', delayed: 0, cls: 'o' };
  if (e.inAt && !e.outAt) return { label: 'In Progress', delayed: Math.max(0, diffMin(e.inAt, v.start)), cls: 'b' };
  if (e.inAt && e.outAt) return { label: 'Clocked out', delayed: 0, cls: 'g' };
  if (now > v.start) { const d = diffMin(now, v.start); if (d > 15 && now < addMin(v.end, 60)) return { label: 'Delayed', delayed: d, cls: 'r' }; if (now >= addMin(v.end, 60)) return { label: 'Missed (no clock in)', delayed: d, cls: 'r' }; }
  return { label: 'Scheduled', delayed: 0, cls: 'gr' };
}
function evvConflicts() {
  const out = []; const now = nowIso();
  DB.visits.forEach(v => {
    const e = v.evv || {}; if (e.resolved) return; const reasons = [];
    if (e.inAt && !e.outAt && now > addMin(v.end, 60)) reasons.push('No clock out');
    if (e.inAt && e.inGps && e.inGps.where && !/patient's home/i.test(e.inGps.where)) reasons.push('Clock in location does not match the patient address (GPS)');
    if (e.outAt && e.outGps && e.outGps.where && !/patient's home/i.test(e.outGps.where)) reasons.push('Clock out location does not match the patient address (GPS)');
    if (e.inAt && Math.abs(diffMin(e.inAt, v.start)) > 60) reasons.push('Clock in more than 60 minutes from the scheduled start');
    if (!e.inAt && now > addMin(v.end, 120) && v.status === 'N') reasons.push('No clock in for a scheduled visit');
    if (reasons.length) out.push({ v, reason: reasons.join('; ') });
  });
  return out;
}
function dashCards() {

ACT.ptCancel = el => {

ACT.ptDelete = el => {
  const c = ctxOf(el);

  needApproval({ roles: ['Administrator'], what: 'Delete a patient', rule: 'Never click Delete on a patient, admission, or document unless the Administrator has authorized it in writing.', who: 'Administrator, in writing', ref: 'R2', go: () => confirmBox('Delete this patient?', `<p><b>${esc(ptName(P(c.params.id)))}</b> and everything filed under this patient will be removed from the practice data. (Reset restores it.)</p>`, () => {
    const pid = c.params.id; DB.patients = DB.patients.filter(x => x.id !== pid); const aids = DB.admissions.filter(a => a.pid === pid).map(a => a.id); DB.admissions = DB.admissions.filter(a => a.pid !== pid); ['referrals', 'docs', 'orders', 'assessments', 'snNotes', 'aideDocs', 'f485', 'commLog', 'forms', 'visits'].forEach(k => (DB[k] = DB[k].filter(x => x.pid !== pid)));
    simLog('override', 'Deleted patient (practice)'); save(); toast('Patient deleted (practice data).', 'ok'); go('patients');
  }, { yes: 'Delete', no: 'Cancel', kind: 'danger', yesCls: 'btn-del', noCls: 'btn-cancel' }) });
};
ACT.ptSave = el => {
  const c = ctxOf(el), d = c.d, isNew = !!c.params.new; c.bad = {}; c.dupNote = '';
  const dobIso = parseD(d.dobT);
  if (!d.last.trim()) c.bad.last = 1; if (!d.first.trim()) c.bad.first = 1; if (!dobIso) c.bad.dob = 1;
  if (Object.keys(c.bad).length) { refresh(); toast('Last name, first name and a valid date of birth (MM/DD/YYYY) are required.', 'err'); return; }
  const apply = () => {
    const rec = isNew ? Object.assign(blankPatient(), { id: uid('P'), created: todayIso(), createdBy: DB.session.userId }) : P(c.params.id);
    ['last', 'first', 'mi', 'suffix', 'sex', 'ethnicity', 'addr1', 'addr2', 'city', 'state', 'zip', 'instructions', 'mrn', 'ssn', 'medicare', 'medicaid', 'email', 'lang', 'comments'].forEach(k => (rec[k] = d[k]));
    rec.last = rec.last.trim().toUpperCase(); rec.first = rec.first.trim().toUpperCase(); rec.mi = (rec.mi || '').trim().toUpperCase(); rec.dob = dobIso; rec.phones = d.phones; rec.em = d.em; rec.altLocs = d.altLocs; rec.contacts = d.contacts;
    if (!rec.mrn) rec.mrn = String(DB.patients.length + 1);
    if (isNew) DB.patients.push(rec); rec.updatedBy = DB.session.userId; rec.updated = nowIso(); save(); track(isNew ? 'pt:created' : 'pt:saved'); simLog('info', (isNew ? 'Created patient ' : 'Saved changes to ') + ptName(rec));
    toast('Saved.', 'ok'); if (isNew) go('patient', { id: rec.id }); else { c.d = ptToForm(rec); c.orig = JSON.stringify(c.d); refresh(); }
  };
  const duplicate = DB.patients.find(x => x.id !== c.params.id && x.last === d.last.trim().toUpperCase() && x.first === d.first.trim().toUpperCase() && x.dob === dobIso);
  const proceed = () => {
    if (!isNew) { const o = P(c.params.id); const sens = o.last !== d.last.trim().toUpperCase() || o.first !== d.first.trim().toUpperCase() || o.dob !== dobIso || o.medicare !== d.medicare || o.medicaid !== d.medicaid || o.ssn !== d.ssn;
      if (sens) { needApproval({ roles: ['Administrator'], what: 'Change name, date of birth or ID numbers', rule: 'Office staff verify. The Administrator approves changes to identifiers and payer information.', who: 'Administrator', ref: 'O1, R2', go: apply }); return; } }
    apply();
  };
  if (isNew && duplicate) { modal({ title: 'Possible duplicate patient', kind: 'warn', size: 'sm', body: `<p><b>${esc(ptName(duplicate))}</b> with the same date of birth already exists.</p><p class="mt">Zenith rule: <b>STOP</b>. Use neither record. Tell the Administrator. Never create a second record for the same patient.</p>`, buttons: [{ label: 'Stop (recommended)', cls: 'btn-ok', click: () => simLog('good', 'Stopped at a possible duplicate patient') }, { label: 'Create anyway (practice)', cls: 'btn-or', click: () => { simLog('override', 'Created a duplicate patient record (practice): ' + ptName(duplicate)); proceed(); } }] }); return; }
  if (isNew) { const sim = DB.patients.find(x => x.last === d.last.trim().toUpperCase() && x.first === d.first.trim().toUpperCase()); if (sim) c.dupNote = 'A patient named ' + ptName(sim) + ' already exists (different date of birth). Check two identifiers before you go on.'; }
  proceed();
};

function certPeriods(a) { const out = []; let s = a.admit; const end = a.dischDate && a.dischDate > a.admit ? a.dischDate : addDays(todayIso(), 120); let n = 0; while (s <= end && n < 40) { const e = addDays(s, 59); out.push({ k: s, from: s, to: e, l: fmtD(s).slice(0, 6) + fmtD(s).slice(8) + ' - ' + fmtD(e).slice(0, 6) + fmtD(e).slice(8), no: n + 1 }); s = addDays(s, 60); n++; } return out; }

    { label: 'Referral (signed)', kind: 'referral', o: { name: nm, dob, date: d1 }, file: 'referral_' + pt.last.toLowerCase() + '.svg' },
    { label: 'Physician order (signed and dated)', kind: 'order', o: { name: nm, dob, date: d1 }, file: 'order_' + pt.last.toLowerCase() + '.svg' },
    { label: 'Physician order (NOT signed)', kind: 'order_unsigned', o: { name: nm, dob, date: d1 }, file: 'order_unsigned_' + pt.last.toLowerCase() + '.svg' },
    { label: 'Face-to-face (encounter ' + fmtD(d12) + ', signed)', kind: 'f2f', o: { name: nm, dob, date: d1, enc: d12 }, file: 'f2f_' + pt.last.toLowerCase() + '.svg' },
    { label: 'Face-to-face (encounter ' + fmtD(dold) + ': too old)', kind: 'f2f_old', o: { name: nm, dob, date: d1, enc: dold }, file: 'f2f_old_' + pt.last.toLowerCase() + '.svg' },
    { label: 'Insurance card copy', kind: 'insurance', o: { name: nm, dob, date: d1, member: pt.medicare || 'PRACTICE-0001' }, file: 'insurance_' + pt.last.toLowerCase() + '.svg' },

      <p class="small mt">Practice signature. It stays in this browser.</p>`,
    mount: (c, mm) => {
      const cv = $('#sigcv', mm.el); if (!cv) return; const g = cv.getContext('2d'); g.lineWidth = 2.2; g.lineCap = 'round'; g.strokeStyle = '#1a3a8a'; let down = false;
      const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
      cv.addEventListener('pointerdown', e => { down = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); g.beginPath(); g.moveTo(x, y); g.lineTo(x + .1, y + .1); g.stroke(); c.drawn = true; });
      cv.addEventListener('pointermove', e => { if (!down) return; const [x, y] = pos(e); g.lineTo(x, y); g.stroke(); });

const ASMT_TYPES = ['OASIS', 'Non-OASIS', 'Pediatric Assessment', 'Non-Skilled Assessment'];
const M0100 = [['01', 'Start of care'], ['03', 'Resumption of care'], ['04', 'Recertification'], ['05', 'Other follow-up'], ['06', 'Transfer to an inpatient facility, patient not discharged'], ['07', 'Transfer to an inpatient facility, patient discharged'], ['08', 'Death at home'], ['09', 'Discharge from agency']];
const ADL_ITEMS = [['m1800', 'M1800 Grooming'], ['m1810', 'M1810 Dress upper body'], ['m1820', 'M1820 Dress lower body'], ['m1830', 'M1830 Bathing'], ['m1840', 'M1840 Toilet transferring'], ['m1845', 'M1845 Toileting hygiene'], ['m1850', 'M1850 Transferring'], ['m1860', 'M1860 Ambulation and locomotion']];
const ADL_OPTS = [['0', '0 Able to do it independently'], ['1', '1 Needs a device or some help'], ['2', '2 Needs hands on help'], ['3', '3 Cannot do it, dependent']];
function asmtReasonText(a) { const k = (a.data && a.data.m0100) || ''; const x = M0100.find(r => r[0] === k); return x ? k + ' ' + x[1] : (a.reason || ''); }
function asmtIsSoc(a) { return a.type === 'OASIS' && ((a.data && a.data.m0100) === '01' || /^01/.test(a.reason || '')); }
function asmtScore(a) { const d = a.data || {}; return ADL_ITEMS.reduce((n, [k]) => n + (d[k] === '' || d[k] == null ? 0 : +d[k]), 0); }
function asmtHipps(a) {
  const d = a.data || {}; const sc = asmtScore(a); const lvl = sc >= 17 ? 3 : sc >= 9 ? 2 : 1; const dx = (d.dx1 || 'A').toUpperCase().charAt(0); const letter = 'ABCDEFGHIJKL'.charAt('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.indexOf(dx) % 12);
  return { code: '1' + letter + lvl + 'A1', pay: (1800 + lvl * 450 + (d.dx1 ? 120 : 0)).toFixed(2) };
}

   Scheduling: Scheduler (month, week, day, cert period), Appointment Details, Batch Entry, Global Calendar,
   CareConnect Monitor, CareConnect Conflicts and the CareConnect page
   ===================================================================================================== */
const STATUS_LIST = [['N', 'Not Completed (N)'], ['H', 'Hospitalized (H)'], ['C', 'Completed (C)'], ['O', 'On Hold (O)'], ['A', 'Cancelled (A)'], ['M', 'Missed (M)']];
const WDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function initials(name) { return String(name || '').split(/[ ,]+/).filter(Boolean).map(x => x[0]).join('').slice(0, 3); }
function ptInit(p) { return p ? (p.first[0] + p.last[0]) : ''; }
function stInit(s) { return s ? (s.first[0] + s.last[0]) : ''; }
function visitCls(v) { const s = visitStatus(v).label; if (s === 'Completed' || s === 'Clocked out') return 'g'; if (s === 'Delayed' || s.indexOf('Missed') === 0) return 'r'; if (s === 'In Progress') return 'y'; if (s === 'Cancelled') return 'gray'; if (s === 'Hospitalized' || s === 'On Hold') return 'p'; return 'b'; }
function overlapV(a1, a2, b1, b2) { return a1 < b2 && b1 < a2; }
function visitConflicts(v, exceptId) {
  const cg = [], pt = []; DB.visits.forEach(x => { if (x.id === exceptId || x.status === 'A' || x.status === 'M') return; if (!overlapV(v.start, v.end, x.start, x.end)) return; if (v.cgId && x.cgId === v.cgId) cg.push(x); else if (v.pid && x.pid === v.pid) pt.push(x); });
  return { cg, pt };
}
function freqParse(s) { const m = /^(\d+)w(\d+)$/i.exec(s || ''); return m ? { per: +m[1], weeks: +m[2] } : null; }
function discFor(v) { const s = ST(v.cgId); return s ? s.disc : ''; }
function credProblems(s) { const t = todayIso(); const out = []; CRED_ITEMS.forEach(([k, l]) => { const c = s.creds[k]; if (c && c.exp && c.exp < t) out.push(l + ' expired ' + fmtD(c.exp)); }); return out; }
function absenceOn(s, dayIso) { return (s.absences || []).find(a => a.from <= dayIso && dayIso <= (a.to || a.from)); }

function gpsMiles(g, pt) { if (!g || g.lat == null) return null; const R = 3958.8, rad = x => x * Math.PI / 180; const dl = rad(g.lat - pt.lat), dn = rad(g.lng - pt.lng); const a = Math.sin(dl / 2) ** 2 + Math.cos(rad(pt.lat)) * Math.cos(rad(g.lat)) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(a)); }

function gpsModal(v) {

/* ===== phone.js ===== */
'use strict';
/* =====================================================================================================
   The CareConnect practice phone: today's schedule, Clock In / Clock Out with a GPS location choice,
   the visit note (SN note, aide note or simple note) and signatures. Everything it does changes the
   same practice data the office screens read (Monitor, Conflicts, SN Notes, Aide Documents).
   ===================================================================================================== */
const PH = { screen: 'login', sess: '', vid: '', ctx: null, nctx: null, tabI: 0, msg: '', err: '' };
const PH_LOCS = [['home', "At the patient's home"], ['car', 'In my car, about 1.2 miles from the home'], ['office', 'At the office, about 4.8 miles away'], ['away', 'At my own house, about 9 miles away'], ['off', 'Location services OFF']];
function phState() { DB.ui.phone = DB.ui.phone || { open: false, who: 'S1', loc: 'home' }; return DB.ui.phone; }
function gpsFor(pt, loc) {
  const base = { lat: pt.lat, lng: pt.lng };
  if (loc === 'home') return Object.assign(base, { where: "At the patient's home" });
  if (loc === 'car') return { lat: pt.lat + 0.018, lng: pt.lng, where: 'About 1.2 miles from the home' };
  if (loc === 'office') return { lat: pt.lat + 0.07, lng: pt.lng + 0.02, where: 'At the office, about 4.8 miles from the home' };
  return { lat: pt.lat - 0.13, lng: pt.lng - 0.05, where: 'Away from the home, about 9 miles' };
}
function asPhone(fn) { const o = ACTOR_STAFF; ACTOR_STAFF = PH.sess || null; try { return fn(); } finally { ACTOR_STAFF = o; } }
function docComplete(v) {
  const d = discFor(v);
  if (v.billingCode && SN_CODES.indexOf(v.billingCode) >= 0) { const n = v.noteId ? byId(DB.snNotes, v.noteId) : null; return !!n && n.status === 'Completed'; }
  if (d === 'HHA') { const a = DB.aideDocs.find(x => x.kind === 'note' && x.visitId === v.id); return !!a && a.status === 'Completed'; }
  return !!(v.simpleDoc && v.simpleDoc.done);
}
function finishIfDone(v) { if (v.status === 'N' && v.evv && v.evv.outAt && docComplete(v)) { v.status = 'C'; save(); } }

ACT.phoneopen = () => { const s = phState(); s.open = true; save(); track('phone:open'); phoneRefresh(); };
ACT.phoneSide = () => { const s = phState(); s.left = !s.left; save(); phoneRefresh(); };
ACT.phoneclose = () => { phState().open = false; save(); phoneRefresh(); };
function phoneRefresh() {
  const root = $('#phone-root'); if (!root) return; const st = phState();
  if (!DB || !DB.session.userId || !st.open) { root.innerHTML = ''; return; }
  if (!PH.ctx) { PH.ctx = ctxNew({ who: st.who, loc: st.loc }); PH.ctx._rr = phoneRefresh; }
  const staff = DB.staff.filter(s => s.cc && s.cc.enabled);
  const sc = $('.scr', root); const sy = sc ? sc.scrollTop : 0;
  root.innerHTML = `<div id="phone" class="${st.left ? 'left' : ''}" data-c="${PH.ctx._id}"><button class="xbtn" data-act="phoneclose">Close phone</button><button class="xbtn" style="right:96px" data-act="phoneSide">Move phone</button><div class="ph-top"><span id="phtime">${fmtT(nowIso())}</span><span>CareConnect (practice)</span><span>LTE &#9646;&#9646;&#9646;</span></div><div class="scr">${phScreen()}</div>
    <div class="ph-ctl"><b>Practice controls</b> (not part of the app)<br>Who is holding this phone?<select id="phWho">${staff.map(s => `<option value="${s.id}"${s.id === st.who ? ' selected' : ''}>${esc(stName(s))} (${s.disc})</option>`).join('')}</select>My location right now:<select id="phLoc">${PH_LOCS.map(([k, l]) => `<option value="${k}"${k === st.loc ? ' selected' : ''}>${l}</option>`).join('')}</select></div></div>`;
  const sc2 = $('.scr', root); if (sc2) sc2.scrollTop = sy;
}
document.addEventListener('change', e => {
  const t = e.target; if (!t || !t.id) return;
  if (t.id === 'phWho') { const s = phState(); s.who = t.value; PH.sess = ''; PH.screen = 'login'; save(); phoneRefresh(); }
  if (t.id === 'phLoc') { phState().loc = t.value; save(); phoneRefresh(); }
});
setInterval(() => { const e = $('#phtime'); if (e && DB) e.textContent = fmtT(nowIso()); }, 5000);
// every change inside a note on the phone is saved straight away
document.addEventListener('change', e => { if (e.target.closest && e.target.closest('#phone') && PH.nctx) { if (PH.screen === 'sn' || PH.screen === 'aide' || PH.screen === 'simple') { if (PH.nctx.n && PH.nctx.n.id) save(); } } });

function appHead(sub, back) { const s = PH.sess ? ST(PH.sess) : null; return `<div class="app-h"><div>${back ? `<button class="ph-x" data-act="phBack">&#8249;</button> ` : ''}CareConnect<small>${esc(sub || (s ? stName(s) : 'Practice app'))}</small></div>${s ? '<button class="ph-x" data-act="phLogout" title="Log out">&#9211;</button>' : ''}</div>`; }
function phScreen() {
  const st = phState();
  if (!PH.sess) {
    const s = ST(st.who); const u = DB.users.find(x => x.staffId === st.who) || { username: s && s.cc.user ? s.cc.user : '' };
    return `${appHead('Sign in')}<div class="ph-b"><p class="tiny">Practice phone. Use your own login. Never share it or sign in for another person.</p><div class="pf"><label>Username</label><input id="phU" type="text" value="${esc(u.username || (s && s.cc.user) || '')}" autocomplete="off"></div><div class="pf"><label>Password</label><input id="phP" type="password" value="practice" autocomplete="off"></div><button class="bigbtn in" data-act="phLogin">Sign in</button>${PH.err ? `<div class="note err"><span>${esc(PH.err)}</span></div>` : ''}<p class="tiny">Practice password for every login: practice</p></div>`;
  }
  const v = PH.vid ? byId(DB.visits, PH.vid) : null;
  if (PH.screen === 'sched' || !v) return phSchedule();
  if (PH.screen === 'visit') return phVisit(v);
  const wrap = html => `<div data-c="${PH.nctx._id}" style="display:contents">${html}</div>`;
  if (PH.screen === 'sn') return wrap(phSN(v));
  if (PH.screen === 'aide') return wrap(phAide(v));
  if (PH.screen === 'simple') return wrap(phSimple(v));
  if (PH.screen === 'missed') return phMissed(v);
  return phSchedule();
}
ACT.phLogin = () => { const u = DB.users.find(x => x.username === $('#phU').value.trim().toLowerCase() && x.active) ; const s = phState(); const staff = ST(s.who);
  const okUser = (u && u.staffId === s.who) || (staff && staff.cc.user === $('#phU').value.trim().toLowerCase());
  if (!okUser || ($('#phP').value !== 'practice')) { PH.err = 'Login failed. Check your username and password. (Practice: the username must belong to the person holding the phone.)'; phoneRefresh(); return; }
  PH.sess = s.who; PH.err = ''; PH.screen = 'sched'; track('phone:login'); phoneRefresh(); };
ACT.phLogout = () => { PH.sess = ''; PH.screen = 'login'; PH.vid = ''; phoneRefresh(); };
ACT.phBack = () => { if (PH.screen === 'visit' || PH.screen === 'missed') { PH.screen = 'sched'; PH.vid = ''; } else PH.screen = 'visit'; PH.msg = ''; phoneRefresh(); };
function phSchedule() {
  const today = todayIso(); const mine = DB.visits.filter(v => v.cgId === PH.sess && v.status !== 'A').sort((a, b) => (a.start < b.start ? -1 : 1));
  const card = v => { const pt = P(v.pid), s = visitStatus(v); return `<div class="vcard" data-act="phVisit" data-id="${v.id}"><b>${fmtT(v.start)} - ${fmtT(v.end)}</b> <span class="tag ${s.cls}" style="float:right">${esc(s.label)}${s.label === 'Delayed' ? ' ' + s.delayed + ' min' : ''}</span><br>${esc(ptName(pt))}<br><span class="tiny">${esc(bcDesc(v.billingCode))}</span></div>`; };
  const t = mine.filter(v => v.start.slice(0, 10) === today), up = mine.filter(v => v.start.slice(0, 10) > today && v.start.slice(0, 10) <= addDays(today, 3));
  return `${appHead()}<div class="ph-b"><b>Today's schedule</b> <span class="tiny">${DAYS[toDate(today).getDay()]} ${fmtD(today)}</span>${t.map(card).join('') || '<p class="tiny" style="margin:14px 0">No visits today.</p>'}<b>Coming up</b>${up.map(v => `<div class="tiny" style="margin-top:6px">${fmtD(v.start)} ${fmtT(v.start)} ${esc(ptName(P(v.pid)))}</div>`).join('') || '<p class="tiny">Nothing in the next 3 days.</p>'}</div>`;
}
ACT.phVisit = el => { PH.vid = el.dataset.id; PH.screen = 'visit'; PH.msg = ''; track('phone:openvisit'); phoneRefresh(); };
function phVisit(v) {
  const pt = P(v.pid), e = v.evv || {}, s = visitStatus(v), adm = admOf(v.pid); const clockedIn = !!e.inAt, clockedOut = !!e.outAt;
  let btn = '';
  if (v.status === 'M') btn = `<div class="note"><span>This visit is marked Missed (${esc(v.missedReason || '')}).</span></div>`;
  else if (!clockedIn) btn = `<button class="bigbtn in" data-act="phClockIn">Clock In</button><p class="tiny">Tap Clock In only when you are inside the patient's home.</p><button class="bigbtn gray" data-act="phMissedGo">I cannot complete this visit</button>`;
  else if (!clockedOut) btn = `<div class="note ok"><span>Clocked in at ${fmtT(e.inAt)}</span></div><button class="bigbtn gray" data-act="phDoc">Document the visit</button><button class="bigbtn out" data-act="phClockOut">Clock Out</button>`;
  else btn = `<div class="note ok"><span>Clocked in ${fmtT(e.inAt)}. Clocked out ${fmtT(e.outAt)}.</span></div>${docComplete(v) ? '<div class="note ok"><span>Note complete and signed.</span></div>' : '<button class="bigbtn gray" data-act="phDoc">Finish the visit note</button>'}`;
  return `${appHead('Visit', true)}<div class="ph-b"><div class="tag ${s.cls}">${esc(s.label)}${s.label === 'Delayed' ? ' ' + s.delayed + ' min' : ''}</div><h3 style="margin:8px 0 2px">${esc(ptName(pt))}</h3><div class="tiny">${esc([pt.addr1, pt.city, pt.state, pt.zip].join(', '))}</div><div class="tiny">${esc(pt.phones.home)}</div><div style="margin:8px 0"><b>${fmtD(v.start)}</b> ${fmtT(v.start)} - ${fmtT(v.end)}<br><span class="tiny">${esc(bcDesc(v.billingCode))}</span></div>${adm && adm.other.precautions ? `<div class="note warn"><span><b>Precautions:</b> ${esc(adm.other.precautions)}</span></div>` : ''}${PH.msg ? `<div class="note ${PH.msgKind || 'warn'}"><span>${esc(PH.msg)}</span></div>` : ''}${btn}</div>`;
}
ACT.phClockIn = () => {
  const v = byId(DB.visits, PH.vid); const st = phState(); const pt = P(v.pid); PH.msg = ''; PH.msgKind = 'warn';
  if (st.loc === 'off') { PH.msg = 'Location services are off. EVV needs your GPS location, so the app will not clock you in. Turn on location (Practice controls below).'; track('phone:nogps'); simLog('good', 'The app refused to clock in with location services off'); phoneRefresh(); return; }
  const other = DB.visits.find(x => x.cgId === PH.sess && x.id !== v.id && x.evv && x.evv.inAt && !x.evv.outAt && x.start.slice(0, 10) === todayIso());
  if (other) { PH.msg = 'You are still clocked in at another visit (' + ptName(P(other.pid)) + '). Clock out there first.'; phoneRefresh(); return; }
  v.evv = v.evv || {}; v.evv.inAt = nowIso(); v.evv.inGps = gpsFor(pt, st.loc); v.evv.outAt = ''; v.evv.outGps = null; v.evv.resolved = false;
  save(); track('phone:clockin'); if (st.loc !== 'home') { track('phone:clockin-away'); PH.msg = 'You clocked in away from the patient\'s home. Never clock in from the car, the office, or home. The office will see a GPS conflict.'; simLog('override', 'Clocked in away from the patient\'s home (' + v.evv.inGps.where + ')'); } else simLog('info', 'Clocked in at the patient\'s home');
  if (Math.abs(diffMin(v.evv.inAt, v.start)) > 60) { PH.msg = (PH.msg ? PH.msg + ' ' : '') + 'You clocked in more than 60 minutes from the scheduled start. This will show on the Conflicts screen.'; }
  phoneRefresh(); refresh();
};
ACT.phClockOut = () => {
  const v = byId(DB.visits, PH.vid); const st = phState(); const pt = P(v.pid); PH.msg = ''; PH.msgKind = 'warn';
  if (st.loc === 'off') { PH.msg = 'Location services are off. Turn on location to clock out.'; phoneRefresh(); return; }
  const go2 = () => { v.evv.outAt = nowIso(); v.evv.outGps = gpsFor(pt, st.loc); finishIfDone(v); save(); track('phone:clockout'); if (st.loc !== 'home') { track('phone:clockout-away'); PH.msg = 'You clocked out away from the patient\'s home. The office will see a GPS conflict.'; simLog('override', 'Clocked out away from the patient\'s home'); } else simLog('info', 'Clocked out at the patient\'s home'); phoneRefresh(); refresh(); };
  if (!docComplete(v)) { PH.msg = ''; modal({ title: 'The note is not finished', kind: 'warn', size: 'sm', body: '<p>Zenith standard: document before you leave the home whenever possible. A note that is not signed stays DRAFT and the visit is not completed.</p>', buttons: [{ label: 'Go back and document (recommended)', cls: 'btn-ok' }, { label: 'Clock out anyway', cls: 'btn-or', click: go2 }] }); return; }
  go2();
};

function phMissed(v) { return `${appHead('Cannot complete visit', true)}<div class="ph-b"><div class="note err"><span><b>Emergency?</b> Call 911 first, then the office.</span></div><p>Why can't you complete this visit? The office will be told.</p>${DB.lists.missedReasons.map(r => `<button class="bigbtn gray" data-act="phMissedPick" data-r="${esc(r)}" style="padding:10px;font-size:14px">${esc(r)}</button>`).join('')}</div>`; }

/* ---------------------------------------------------------------- documenting the visit */
ACT.phDoc = () => {
  const v = byId(DB.visits, PH.vid); const d = discFor(v); PH.tabI = 0; PH.msg = '';
  if (SN_CODES.indexOf(v.billingCode) >= 0) { const n = ensureNote(v); n.start = v.evv.inAt; n.end = v.evv.outAt || ''; n.data = n.data || {}; n.sig = n.sig || {}; PH.nctx = ctxNew({ n }); PH.nctx._rr = phoneRefresh; PH.screen = 'sn'; }
  else if (d === 'HHA') { const poc = aidePoc(v.pid); let ex = DB.aideDocs.find(x => x.kind === 'note' && x.visitId === v.id); if (!ex) { ex = { id: uid('AD'), pid: v.pid, kind: 'note', title: 'Aide Note', visitId: v.id, cgId: v.cgId, from: v.start.slice(0, 10), to: v.start.slice(0, 10), status: 'In Use', tasks: [], done: {}, why: {}, narrative: '', sig: null, pat: null, by: DB.session.userId }; DB.aideDocs.push(ex); save(); } PH.nctx = ctxNew({ n: { visitId: v.id, done: JSON.parse(JSON.stringify(ex.done || {})), why: JSON.parse(JSON.stringify(ex.why || {})), narrative: ex.narrative || '', sig: ex.sig || null, pat: ex.pat || null }, ex, poc }); PH.nctx._rr = phoneRefresh; PH.screen = 'aide'; }
  else { v.simpleDoc = v.simpleDoc || { text: '', sig: null, done: false }; PH.nctx = ctxNew({ n: v.simpleDoc }); PH.nctx._rr = phoneRefresh; PH.screen = 'simple'; }
  phoneRefresh();
};
function phNoteHead(title, sub) { return `${appHead(title, true)}`; }
function phSN(v) {
  const c = PH.nctx; const n = c.n; const tabs = SN_TABS; const i = Math.min(PH.tabI, tabs.length - 1); const tab = tabs[i];
  let body = '';
  if (tab.k === 'vital') body += `<div class="pf"><label>Type of Visit</label>${VISIT_TYPES.map(t => radio(c, 'n.visitType', t, t)).join('<br>')}</div>`;
  if (tab.k === 'qa') {
    const { errs, warns } = snValidation(c);
    body += `<div class="note ${errs.length ? 'err' : 'ok'}"><span><b>Errors: ${errs.length}</b> &nbsp; Warnings: ${warns.length}</span></div>${errs.concat(warns).map(x => `<div class="tiny" style="margin:4px 0"><a data-act="phJump" data-tab="${x.tab}">&#9998;</a> <b>${esc(x.tabLabel)}</b>: ${esc(x.msg)}</div>`).join('')}
      <div class="box"><b>Nurse signature</b><br>${n.sig && n.sig.nurse ? sigImg(n.sig.nurse, 40) + '<div class="tiny">' + fmtDT(n.sig.nurse.at) + '</div>' : (n.nurseSigned ? 'Signed' : `<button class="bigbtn in" style="padding:9px;font-size:14px" data-act="phSignN">Sign as ${esc(stName(ST(n.cgId)))}</button>`)}</div>
      <div class="box"><b>Patient signature</b><br>${n.sig && n.sig.pat ? sigImg(n.sig.pat, 40) : (n.patSigned ? 'Signed' : `<button class="bigbtn gray" style="padding:9px;font-size:14px" data-act="phSignP">Patient signs</button><label class="chk tiny"><input type="checkbox" ${battr(c, 'n.patUnable')} data-rr="1"${n.patUnable ? ' checked' : ''}> Patient unable to sign</label>${n.patUnable ? inp(c, 'n.patUnableWhy', { ph: 'Reason' }) : ''}`)}</div>
      ${n.status === 'Completed' ? '<div class="note ok"><span>The note is complete. QA Pending.</span></div>' : ''}<p class="tiny"><a data-act="phFill">Practice shortcut: fill every tab</a></p>`;
  }
  body += tab.secs.map(s => snSectionHtml(c, s, false)).join('');
  if (tab.k === 'summ') body += `<div class="pf"><label>Narrative (summary of the visit)</label>${txt(c, 'n.data.narrative', { rows: 4 })}</div>`;
  return `${phNoteHead('SN note')}<div class="ph-b"><div class="tiny">${esc(ptName(P(n.pid)))}</div><div class="tiny">${i + 1} of ${tabs.length}</div><h3 style="margin:2px 0 6px">${esc(tab.l)}</h3>${body}<div class="flex mt"><button data-act="phTab" data-d="-1" style="flex:1;padding:8px">&#8249; Back</button><button data-act="phTab" data-d="1" style="flex:1;padding:8px">Next &#8250;</button></div></div>`;
}
ACT.phTab = el => { const n = SN_TABS.length; PH.tabI = Math.max(0, Math.min(n - 1, PH.tabI + +el.dataset.d)); phoneRefresh(); };
ACT.phJump = el => { PH.tabI = SN_TABS.findIndex(t => t.k === el.dataset.tab); phoneRefresh(); };
ACT.phFill = () => { const c = PH.nctx; c.n.data = Object.assign(c.n.data || {}, snFullData()); if (!c.n.visitType) c.n.visitType = 'Skilled Nursing'; save(); phoneRefresh(); toast('Sample answers entered on every tab.', 'sim'); };
ACT.phSignN = () => asPhone(() => { const c = PH.nctx; if (!snSignGuard(c, 'nurse')) return; sigPad('Nurse Signature', stName(ST(c.n.cgId)), s => { c.n.sig = c.n.sig || {}; c.n.sig.nurse = s; c.n.nurseSigned = true; c.n.signedAt = s.at; track('sn:nursesigned'); track('phone:signed'); snAfterSign(c); finishIfDone(byId(DB.visits, PH.vid)); phoneRefresh(); refresh(); }); });
ACT.phSignP = () => { const c = PH.nctx; sigPad('Patient Signature', ptName(P(c.n.pid)), s => { c.n.sig = c.n.sig || {}; c.n.sig.pat = s; c.n.patSigned = true; track('sn:patsigned'); asPhone(() => snAfterSign(c)); finishIfDone(byId(DB.visits, PH.vid)); phoneRefresh(); refresh(); }, { hint: 'Hand the phone to the patient. The patient signs in the box. Patient: ' }); };

function phAide(v) {
  const c = PH.nctx; const n = c.n, poc = c.poc; const tasks = poc ? poc.tasks : [];
  return `${phNoteHead('Aide note')}<div class="ph-b"><div class="tiny">${esc(ptName(P(v.pid)))}</div>${poc ? '' : '<div class="note warn"><span>There is no Aide Plan of Care. Stop and call the RN.</span></div>'}<h3 style="margin:2px 0 6px">Tasks</h3>${tasks.map((t, i) => `<div class="box" style="margin:6px 0;padding:6px 8px"><b>${esc(t)}</b><br>${radio(c, 'n.done.' + i, 'Done', 'Done', { rr: 1 })} ${radio(c, 'n.done.' + i, 'Not done', 'Not done', { rr: 1 })}${n.done[i] === 'Not done' ? inp(c, 'n.why.' + i, { ph: 'Why was it not done?' }) : ''}</div>`).join('')}<div class="pf"><label>Narrative</label>${txt(c, 'n.narrative', { rows: 3 })}</div>
    <div class="box"><b>Aide signature</b><br>${n.sig ? sigImg(n.sig, 40) : '<button class="bigbtn in" style="padding:9px;font-size:14px" data-act="phAideSign">Sign</button>'}</div><div class="box"><b>Patient signature (if able)</b><br>${n.pat ? sigImg(n.pat, 40) : '<button class="bigbtn gray" style="padding:9px;font-size:14px" data-act="phAideSignP">Patient signs</button>'}</div>
    ${c.ex.status === 'Completed' ? '<div class="note ok"><span>The note is complete.</span></div>' : ''}<button class="bigbtn in" data-act="phAideDone">Complete the note</button><button class="bigbtn gray" data-act="phAideDraft">Save draft</button></div>`;
}
function aideBind(c) { return { n: c.n }; }
ACT.phAideSign = () => asPhone(() => { const c = PH.nctx; const v = byId(DB.visits, PH.vid); if (!isMine(v.cgId)) { neverDo('Sign for another aide', 'Zenith rule: never sign for another person.', 'AI2'); return; } sigPad('Aide Signature', stName(ST(v.cgId)), s => { c.n.sig = s; phoneRefresh(); }); });
ACT.phAideSignP = () => { const c = PH.nctx; const v = byId(DB.visits, PH.vid); sigPad('Patient Signature', ptName(P(v.pid)), s => { c.n.pat = s; phoneRefresh(); }); };
ACT.phAideDone = () => asPhone(() => { const c = PH.nctx; const v = byId(DB.visits, PH.vid); c.n.visitId = v.id; const r = aideNoteSave(v.pid, c.ex, { n: c.n }, c.poc, true); if (r !== false) { finishIfDone(v); } phoneRefresh(); });
ACT.phAideDraft = () => asPhone(() => { const c = PH.nctx; const v = byId(DB.visits, PH.vid); c.n.visitId = v.id; aideNoteSave(v.pid, c.ex, { n: c.n }, c.poc, false); phoneRefresh(); });

function phSimple(v) {
  const c = PH.nctx; const n = c.n;
  return `${phNoteHead('Visit note')}<div class="ph-b"><div class="tiny">${esc(ptName(P(v.pid)))} &nbsp; ${esc(bcDesc(v.billingCode))}</div><div class="pf"><label>What you did and observed (use the patient's own words for complaints)</label>${txt(c, 'n.text', { rows: 7 })}</div><div class="box"><b>Your signature</b><br>${n.sig ? sigImg(n.sig, 40) : '<button class="bigbtn in" style="padding:9px;font-size:14px" data-act="phSimpleSign">Sign</button>'}</div>${n.done ? '<div class="note ok"><span>The note is complete.</span></div>' : '<button class="bigbtn in" data-act="phSimpleDone">Complete the note</button>'}</div>`;
}
ACT.phSimpleSign = () => asPhone(() => { const c = PH.nctx; const v = byId(DB.visits, PH.vid); if (!isMine(v.cgId)) { neverDo('Sign for someone else', 'Zenith rule: never sign for another person.', 'N3'); return; } sigPad('Signature', stName(ST(v.cgId)), s => { c.n.sig = s; save(); phoneRefresh(); }); });
ACT.phSimpleDone = () => { const c = PH.nctx; const v = byId(DB.visits, PH.vid); if (!String(c.n.text || '').trim()) { toast('Write the note first.', 'err'); return; } if (!c.n.sig) { toast('Sign the note first.', 'err'); return; } c.n.done = true; const map = { PT: 'pt', PTA: 'pt', OT: 'ot', OTA: 'ot', ST: 'st', MSW: 'msw' }; const type = map[discFor(v)] || 'sup'; DB.forms.push({ id: uid('FM'), pid: v.pid, type, date: v.start.slice(0, 10), d: { f1: 'Visit note', f2: c.n.text }, by: DB.session.userId }); finishIfDone(v); save(); track('phone:simple-done'); phoneRefresh(); refresh(); };

'use strict';
/* =====================================================================================================
   Human Resources and Setup: Staff (Caregiver) list and record, folders, setup lists, user access, COVID screening
   ===================================================================================================== */
const EMP_TYPES = ['Employee', 'Contractor', 'Per Diem'];
const PROFILE_BTNS = ['Print Staff Profile', 'Track Absences', 'Staff (Caregiver) Communication Log', 'Enable CareConnect', 'HHVBP Legacy'];
ROUTES.staff = {
  render(c, p) {
    if (p.add && !c._added) { c._added = true; setTimeout(() => ACT.stAdd(), 0); }
    if (c.inactive === undefined) c.inactive = false;
    const tbl = DT(c, 'st', () => ({ filterBtn: true, sort: 'name',
      cols: [{ key: 'act', label: 'Action', sortable: false, blue: true, render: r => rowIcons([{ ic: 'edit', t: 'Open the record', act: 'stOpen', data: { id: r.id } }, { ic: 'trash', t: 'Delete (never)', act: 'stDelete', data: { id: r.id }, cls: 'del' }]) },
        { key: 'name', label: 'Staff (Caregiver) Name', blue: true, text: r => stName(r), render: r => esc(stName(r)) + (r.active ? '' : ' <span class="tag gr">Inactive</span>') }, { key: 'disc', label: 'Discipline', text: r => r.disc, render: r => esc(r.disc) }],
      rows: DB.staff.filter(s => !s.draft && (c.inactive || s.active)), searchText: r => stName(r) + ' ' + r.empId + ' ' + r.disc }));
    return pageHead('Staff Demographics', 'Find Staff Member') + `<div class="bar"><h2>${ic('user')} Staff (Caregivers)</h2><button class="btn btn-add" data-act="stAdd">${ic('plus')} Add</button></div>${tbl}<label class="chk mt"><input type="checkbox" ${battr(c, 'inactive')} data-rr="1"${c.inactive ? ' checked' : ''}> Include inactive staff</label>`;
  },
};
ACT.stOpen = el => { track('staff:open'); go('staff-rec', { id: el.dataset.id }); };
ACT.stAdd = () => needApproval({ roles: ['Administrator', 'HR'], what: 'Add a new staff member (+ Add)', rule: 'Do not create a new staff record without first searching (H1). A new hire only, never an existing person.', who: 'Administrator or HR', ref: 'H1, H2', go: () => { track('staff:addclick'); go('staff-rec', { id: 'NEW', add: 1 }); } });
ACT.stDelete = el => needApproval({ roles: ['Administrator'], what: 'Click the red trash icon on a staff member', rule: 'NEVER click the red trash icon. Former staff are made inactive, not deleted. Never click Delete unless the Administrator authorized it in writing.', who: 'Administrator, in writing', ref: 'H1, R2', go: () => confirmBox('Delete this staff record?', '<p>The record is removed from the practice data. (Reset restores it.) Real Alora keeps former staff as inactive.</p>', () => { DB.staff = DB.staff.filter(s => s.id !== el.dataset.id); save(); simLog('override', 'Deleted a staff record (practice)'); refresh(); }, { yes: 'Delete', no: 'Cancel' }) });

function blankStaff() { return { id: 'NEW', last: '', first: '', mi: '', empId: '', disc: '', active: true, empType: '', dob: '', sex: '', ssn: '', title: '', hire: '', term: '', addr1: '', addr2: '', city: '', state: 'FL', zip: '', covZips: '', lic: '', exclPayroll: false, phones: { home: '', cell: '', work: '', pager: '' }, noText: false, fax: '', email: '', emName: '', emPhone: '', comments: '', creds: {}, docs: [], absences: [], commLog: [], pay: [], avail: {}, cc: { enabled: false, user: '', invited: '' } }; }
function stToForm(s) { const d = JSON.parse(JSON.stringify(s)); d.dobT = fmtD(s.dob); d.hireT = fmtD(s.hire); d.termT = fmtD(s.term); d.credT = {}; CRED_ITEMS.forEach(([k]) => { const c = s.creds[k] || {}; d.credT[k] = { exp: fmtD(c.exp), remark: c.remark || '' }; }); return d; }
ROUTES['staff-rec'] = {
  render(c, p) {
    const isNew = p.id === 'NEW';
    if (!c.d) { const src = isNew ? blankStaff() : ST(p.id); if (!src) return notice('Staff member not found.', 'err'); c.d = stToForm(src); c.orig = JSON.stringify(c.d); c.tab = 'demo'; }
    const d = c.d; const tabs = tabsHtml([{ k: 'demo', l: 'Staff Demographics' }, { k: 'cred', l: 'Credential Tracking' }, { k: 'pay', l: 'Staff (Caregiver) Standard Pay Rate' }, { k: 'docs', l: 'Electronic Staff Records' }, { k: 'avail', l: 'Availability' }].map(t => Object.assign(t, { off: isNew && t.k !== 'demo' })), c.tab, 'stTab');
    const titles = { demo: 'Staff Demographics', cred: 'Credential Tracking', pay: 'Standard Pay Rate', docs: 'Electronic Staff Records', avail: 'Availability' };
    let pane = { demo: stDemo, cred: stCred, pay: stPay, docs: stDocs, avail: stAvail }[c.tab](c, d, isNew);
    return pageHead(titles[c.tab], c.tab === 'cred' ? 'Summary' : '') + tabs + `<div class="tabpane">${pane}</div>${c.tab !== 'demo' ? `<div class="flex mt">${[PROFILE_BTNS[0], PROFILE_BTNS[2]].map(b => `<button class="btn btn-add" data-act="${b === PROFILE_BTNS[0] ? 'stProfile' : 'stComm'}">${b}</button>`).join('')}</div>` : ''}`;
  },
};
ACT.stTab = el => { const c = ctxOf(el); if (el.classList.contains('off')) { toast('Alora opens the other tabs after the record is saved.', 'sim'); return; } c.tab = el.dataset.k; track('staff:tab:' + c.tab); refresh(); };
function stDemo(c, d, isNew) {
  const b = c.bad || {};
  return `<div class="sec">Staff (Caregiver) Demographics</div><div class="flex" style="align-items:flex-start;gap:20px"><div style="width:200px;border:1px dotted #aaa;height:200px;display:flex;align-items:center;justify-content:center;color:#666;text-align:center">Profile Photo<br><span class="small">(not used in the simulator)</span></div><div class="grow"><h4 style="font:400 20px var(--font)">Staff Member Name</h4><div class="row" style="grid-template-columns:2fr 2fr 80px">${fg('Last Name', inp(c, 'd.last', { cls: b.last ? 'bad' : '' }), { req: 1 })}${fg('First Name', inp(c, 'd.first', { cls: b.first ? 'bad' : '' }), { req: 1 })}${fg('MI', inp(c, 'd.mi', { max: 1 }))}</div><div class="row" style="grid-template-columns:1fr 1fr 1fr">${fg('Employee ID', inp(c, 'd.empId', { cls: b.empId ? 'bad' : '' }), { req: 1 })}${fg('Discipline', s2(c, 'd.disc', 'disciplines', { ph: 'Enter...' }), { req: 1 })}<div class="fg"><label class="chk" style="margin-top:24px"><input type="checkbox" data-act="stActive" ${battr(c, 'd.active')}${d.active ? ' checked' : ''}> Active</label></div></div>${fg('Employment Type', sel(c, 'd.empType', EMP_TYPES), {})}</div></div>
  <hr class="hr"><div class="row c3">${fg('Date of Birth', dp(c, 'd.dobT'))}${fg('Sex', sel(c, 'd.sex', ['Male', 'Female', 'Unknown']))}${fg('SSN', inp(c, 'd.ssn', { type: 'password' }))}${fg('Title', inp(c, 'd.title'))}${fg('Hire Date', dp(c, 'd.hireT'))}${fg('Termination Date:', dp(c, 'd.termT'))}</div>
  <div class="row" style="grid-template-columns:1fr">${fg('Address Line 1', inp(c, 'd.addr1'))}${fg('Address Line 2', inp(c, 'd.addr2'))}</div><div class="row" style="grid-template-columns:3fr 100px 1fr">${fg('City', inp(c, 'd.city'))}${fg('State', inp(c, 'd.state'))}${fg('Zip', inp(c, 'd.zip'))}</div>
  ${fg('Covered Zip Codes <a data-act="zipHelp">&#9432;</a>', inp(c, 'd.covZips'))}${fg('Professional License Number', inp(c, 'd.lic'))}<div class="fg">${chk(c, 'd.exclPayroll', 'Exclude from payroll')}</div>
  <div class="row c4">${fg('Home Phone', inp(c, 'd.phones.home'))}${fg('Cell Phone', inp(c, 'd.phones.cell'))}${fg('Work Phone', inp(c, 'd.phones.work'))}${fg('Pager', inp(c, 'd.phones.pager'))}</div><div class="fg">${chk(c, 'd.noText', 'Do not send text messages')}</div><div class="row c2">${fg('Fax', inp(c, 'd.fax'))}${fg('E-mail', inp(c, 'd.email', { type: 'email' }))}${fg('Emergency Contact', inp(c, 'd.emName'))}${fg('Emergency Contact Phone Number', inp(c, 'd.emPhone'))}</div>
  <div class="box"><h4>Staff Regions list</h4><table class="t"><thead><tr><th>Region name</th><th>Action</th></tr></thead><tbody><tr><td colspan="2" class="none">No regions (practice)</td></tr></tbody></table></div>${fg('Comments', txt(c, 'd.comments', { rows: 3 }))}
  <hr class="hr"><div class="flex" style="justify-content:flex-end"><button class="btn" style="background:#8bc34a;color:#fff" data-act="stSave">Save &amp; Close</button><button class="btn btn-save" style="background:#3b8fd0" data-act="stCancel">Cancel</button></div>
  <div class="flex mt" style="gap:8px">${PROFILE_BTNS.map(b => `<button class="btn btn-add${isNew && b !== PROFILE_BTNS[0] ? ' dis' : ''}" data-act="${{ 'Print Staff Profile': 'stProfile', 'Track Absences': 'stAbs', 'Staff (Caregiver) Communication Log': 'stComm', 'Enable CareConnect': 'stCC', 'HHVBP Legacy': 'stHhvbp' }[b]}">${b}</button>`).join('')}</div>`;
}
ACT.zipHelp = () => alertBox('Covered Zip Codes', '<p>List the zip codes this caregiver can cover, separated by commas. The Scheduler uses it for "Show Caregivers in Patient\'s Region | Zip Code".</p>');
ACT.stHhvbp = () => alertBox('HHVBP Legacy', '<p class="stub">' + simplified() + ' This button opens a value-based purchasing form in the real Alora. It is not in Zenith\'s manual, so it is not simulated.</p>');
ACT.stActive = el => { const c = ctxOf(el); c.d.active = el.checked; if (!el.checked) { simLog('info', 'Marked a staff member inactive (the right way to remove someone)'); track('staff:inactive'); } };
function stDirty(c) { return JSON.stringify(c.d) !== c.orig; }
ACT.stCancel = el => { const c = ctxOf(el); if (c.params.new || c.params.id === 'NEW') confirmBox('Cancel', '<p>This unsaved document will be deleted. Are you sure?</p>', () => { track('staff:newcancel'); go('staff'); }, { yes: 'Yes', no: 'No' }); else { if (stDirty(c)) { c.d = stToForm(ST(c.params.id)); c.orig = JSON.stringify(c.d); refresh(); toast('What you typed was undone.', 'ok'); } else go('staff'); } };
ACT.stSave = el => {
  const c = ctxOf(el), d = c.d, isNew = c.params.id === 'NEW'; c.bad = {};
  if (!d.last.trim()) c.bad.last = 1; if (!d.first.trim()) c.bad.first = 1; if (!d.empId.trim()) c.bad.empId = 1;
  if (Object.keys(c.bad).length || !d.disc) { c.tab = 'demo'; refresh(); toast('Last name, first name, Employee ID and Discipline are required.', 'err'); return; }
  const dup = DB.staff.find(x => x.id !== c.params.id && ((x.last === d.last.trim().toUpperCase() && x.first === d.first.trim().toUpperCase()) || x.empId === d.empId.trim()));
  const apply = () => {
    const rec = isNew ? Object.assign(blankStaff(), { id: uid('S') }) : ST(c.params.id);
    ['last', 'first', 'mi', 'empId', 'disc', 'active', 'empType', 'sex', 'ssn', 'title', 'addr1', 'addr2', 'city', 'state', 'zip', 'covZips', 'lic', 'exclPayroll', 'noText', 'fax', 'email', 'emName', 'emPhone', 'comments'].forEach(k => (rec[k] = d[k]));
    rec.last = rec.last.trim().toUpperCase(); rec.first = rec.first.trim().toUpperCase(); rec.empId = rec.empId.trim(); rec.dob = parseD(d.dobT) || ''; rec.hire = parseD(d.hireT) || ''; rec.term = parseD(d.termT) || ''; rec.phones = d.phones;
    if (isNew) { rec.avail = {}; ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].forEach(x => (rec.avail[x] = { on: true, from: '08:00', to: '17:00' })); ['Sat', 'Sun'].forEach(x => (rec.avail[x] = { on: false, from: '', to: '' })); DB.staff.push(rec); }
    save(); track(isNew ? 'staff:created' : 'staff:saved'); simLog('info', (isNew ? 'Created staff ' : 'Saved staff ') + stName(rec)); toast('Saved.', 'ok'); if (isNew) go('staff-rec', { id: rec.id }); else { c.d = stToForm(rec); c.orig = JSON.stringify(c.d); go('staff'); }
  };
  if (isNew && dup) { modal({ title: 'Possible duplicate staff record', kind: 'warn', size: 'sm', body: `<p><b>${esc(stName(dup))}</b> (Employee ID ${esc(dup.empId)}) looks like the same person or the same ID.</p><p class="mt">Zenith rule: STOP. Two records for one person is never allowed. Tell the Administrator.</p>`, buttons: [{ label: 'Stop (recommended)', cls: 'btn-ok', click: () => simLog('good', 'Stopped at a possible duplicate staff record') }, { label: 'Create anyway (practice)', cls: 'btn-or', click: () => { simLog('override', 'Created a duplicate staff record (practice)'); apply(); } }] }); return; }
  apply();
};

/* Credential Tracking */
function stCred(c, d) {
  const tbl = DT(c, 'cr', () => ({ sort: 'code', noPaging: false, firstLast: false, sizes: [10, 25],
    cols: [{ key: 'code', label: 'Code', blue: true, text: r => r[0], render: r => esc(r[0]) }, { key: 'desc', label: 'Item Description', text: r => r[1], render: r => esc(r[1]) }, { key: 'exp', label: 'Expiration Date', sortable: false, text: r => (d.credT[r[0]] || {}).exp || '', render: r => dp(c, 'd.credT.' + r[0] + '.exp') + (credFlag(d.credT[r[0]].exp)) }, { key: 'remark', label: 'Remark', sortable: false, text: r => (d.credT[r[0]] || {}).remark || '', render: r => inp(c, 'd.credT.' + r[0] + '.remark') }],
    rows: CRED_ITEMS }));
  return `${tbl}<p class="small">Do not enter an expiration date you have not seen on the actual document. Expired items are marked in red; items due in 30 days are marked in orange.</p><div class="flex mt" style="justify-content:flex-end"><button class="btn btn-save" data-act="stCredSave">Save</button><button class="btn btn-cancel" data-act="stCredCancel">Cancel</button><button class="btn btn-close" data-act="stClose">Close</button></div>`;
}
function credFlag(txt2) { const iso = parseD(txt2); if (!iso) return ''; const dd = diffDays(iso, todayIso()); if (dd < 0) return ' <span class="tag r">Expired</span>'; if (dd <= 30) return ' <span class="tag o">Due in ' + dd + ' days</span>'; return ''; }
ACT.stClose = () => go('staff');
ACT.stCredCancel = el => { const c = ctxOf(el); c.d.credT = stToForm(ST(c.params.id)).credT; refresh(); };
ACT.stCredSave = el => {
  const c = ctxOf(el); const s = ST(c.params.id); const changed = []; const bad = [];
  CRED_ITEMS.forEach(([k, l]) => { const t = c.d.credT[k]; const iso = parseD(t.exp); if (t.exp && !iso) bad.push(l); const old = s.creds[k] || {}; if ((iso || '') !== (old.exp || '') || (t.remark || '') !== (old.remark || '')) changed.push([k, l, iso, t.remark]); });
  if (bad.length) { toast('Check the date for: ' + bad.join(', ') + ' (MM/DD/YYYY).', 'err'); return; }
  if (!changed.length) { toast('Nothing changed.', 'ok'); return; }
  const m = ctxNew({ seen: false });
  modal({ title: 'Confirm before saving', kind: 'warn', size: 'sm', ctx: m, body: cc => `<p>You are changing ${changed.length} credential${changed.length === 1 ? '' : 's'}:</p><ul>${changed.map(x => `<li>${esc(x[1])}: ${esc(x[2] ? fmtD(x[2]) : '(blank)')}</li>`).join('')}</ul>${chk(cc, 'seen', 'I saw these dates on the actual documents')}`, buttons: [{ label: 'Save', cls: 'btn-ok', click: () => { if (!m.seen) { toast('Zenith rule: do not enter a date you have not seen on the actual document.', 'err'); return false; } changed.forEach(([k, l, iso, rem]) => { s.creds[k] = { exp: iso || '', remark: rem || '' }; }); save(); track('staff:credsaved'); simLog('info', 'Saved credential dates for ' + stName(s)); c.orig = JSON.stringify(c.d); refresh(); toast('Credentials saved.', 'ok'); } }, { label: 'Cancel', cls: 'btn-del' }] });
};
